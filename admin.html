<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta
      name="viewport"
      content="'width=device-width,initial-scale=1.0"
    >
    <title>Game Library Admin</title>
    <link
       rel="stylesheet"
       href="/assets/style.css"
    >

</head>

<body>
<header class="navbar">
    <div class="logo">
       Game Admin
    </div>
    <a href="/">
        View Website
    </a>

</header>

<main class="library">
    <!--LOGIN -->
   <section id="login-section">
      <h1>Admin Login</h1>
      <br>
      <form method="POST" action="/api/admin/login">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">Login</button>

</form>
      <br>
      <p id="login-message"></p>
    
    
    
    </section>

    <!-- ADMIN DASHBOARD-->
    <section
       id="dashboard"
       style="display:none"
    >
       <h1>ADMIN DASHBOARD</h1>
       <br>
       <button
          class=""primary-button"
          onclick="showAddGame()"
        >
           + Add Game
        </button>
        <button onclick="logout()">
           Logout
        </button>
        <br><br>
        <h2>Website Text</h2>
        <label>
            Hero Title
        </label>
        <input
           id="hero-title"
           style="width:100%;padding:10px"
        >
        <br><br>
        <label>
            Announcement
        </label>
        <input   
           id="announcement"
           style="width:100%;padding:10px"
        >
        <br><br>
        <label>
            About Text
        </label>
        <textarea
           id="about-text"
           style="width:100%;height:120px"
        ></textarea>
        <br><br>
        <button
          class="primary-button"
          onclick="saveContent()"
        >
           Save Website Text
    </button>

    </section>

    <!-- ADD GAMEEE-->
    <section
        id="game-form"
        style="display:none"
    >
       <h2>Add New Game</h2>
       <br>
       <form
          id="add-game-form"
       >
          <input
             name="name"
             placeholder="Game name"
             required
           >
           <br><br>

           <textarea
              name="description"
              placeholder="Description"
              required
           ></textarea>
           <br><br>
           <input
              name="category"
              placeholder="Category"
              required
           >
           <br><br>
           <input
              name="playable_url"
              placeholder="Playable URL"
              required
           >
           <br><br>
           <input
              name="creator"
              placeholder="Creator / Team"
              required
           >
           <br><br>

           <label>
               Thumbnail
           </label>
           <input
              name="thumbnail"
              type="file"
              accept=".png,.jpg..jpeg,.webp"
           >
           <br><br>
          <label>
              <input
                  name="published"
                  type="checkbox"
               >
               Publish immediately
           </label>
           <br><br>
           <label>
               <input
                  name="featured"
                  type="checkbox"
               >
               Featured game
           </label>
           <br><br>
           <button 
              class="primart-button"
              type="'submit"
           ></button>
       </form>
    </section>
</main>
<script src="/assets/admin.js"></script>
</body>
</html>
