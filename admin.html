<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta
      name="viewport"
      content="'width=device-width,initial-scale=1.0"
    >
    <title>Game Library Admin</title>
    <link
       rel="stylesheet"
       href="/assets/style.css"
    >

</head>

<body>
<header class="navbar">
    <div class="logo">
       Game Admin
    </div>
    <a href="/">
        View Website
    </a>

</header>

<main class="library">
    <!--LOGIN -->
   <section id="login-section">
      <h1>Admin Login</h1>
      <br>
      <input
         id="username"
         placeholder="Username"
        >
      <br><br>
      <input
           id="password"
           type="password"
           placeholder="Password"
        >
       <br><br>
       <button
          class="primary-button"
          onclick="login()"
        >
           Login
       </button>
       <p id="login-message"></p>
    
    
    
    </section>

    <!-- ADMIN DASHBOARD-->
    <section
       id="dashboard"
       style="display:none"
    >
       <h1>ADMIN DASHBOARD</h1>
       <br>
       <button
          class=""primary-button"
          onclick="showAddGame()"
        >
           + Add Game
        </button>
        <button onclick="logout()">
           Logout
        </button>
        <br><br>
        <h2>Website Text</h2>
        <label>
            Hero Title
        </label>
        <input
           id="hero-title"
           style="width:100%;padding:10px"
        >
        <br><br>
        <label>
            Announcement
        </label>
        <input   
           id="announcement"
           style="width:100%;padding:10px"
        >
        <br><br>
        <label>
            About Text
        </label>
        <textarea
           id="about-text"
           style="width:100%;height:120px"
        ></textarea>
        <br><br>
        <button
          class="primary-button"
          onclick="saveContent()"
        >
           Save Website Text
    </button>

    </section>

    <!-- ADD GAMEEE-->
</main>
</body>
</html>
