<!DOCTYPE html>
<html lang="en">
    <head>
        <title>GAME LIBRARY</title>
        <meta charset="utf-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <!--navigation bar--> 
       <header class="navbar">
        <div class="logo">
            TREASURE BOX
        </div>
        <nav> 
    
            <a href="#home">Home</a>

            <a href="#games">
                Games
            </a>
            <a href="#categories">
                Categories
            </a>

        </nav>
    </header>

       <!--main content-->
       <main>
         <!--hero section-->
         <section class="hero" id="home">
            <div class="hero-text">
                <h1 class="hero-h1">
                    PLAY
                    <br>
                    OUR
                    <br>
                    GAMES.
                </h1>

                <a href="#games" class="hero-button">
                    <h2>
                        OUR GAMES
                    </h2>
                </a>

            </div>
         </section>

         <!--game library-->
         <section class="games-section" id="games">
            

         <!--categories-->
        <section class="categories-section" id="categories">



            <div class="section-heading">
                <div>
                    <h2 id="genre-h2">
                        Genres 
                    </h2>
                    
                </div>
            </div>

             <div class="categories">
<a href="#adventure" class="category-genre">
    ADVENTURE
</a>

<a href="#players2" class="category-genre">
    TWO PLAYERS <br> GAMES
</a>
            </div>


            <div class="c.ategories">
                 <div class="game-grid">
                <div class="category.genre" id="adventure">

                               <h3> 
                        Adventure
                    </h3>
                    <!--era breaker-->
                <article class="game-card">
                    <div class="game-image">
                        <img 
                        src="images/era-breaker.jpg"
                        alt="Era Breaker">
                    </div>

                    <div class="game-info">
                
                        <a href="#" 
                        class="https://rameesha-maker.github.io/ERA-BREAKER/"
                        data-game="era"
                        > <h3>
                         ERA BREAKER
                    </h3>
                        </a>
                         <p>
                    Doremon inspired 
                        </p>
                </div>
            </div>
                </article>
                <div class="category.genre" id="players2">
                    
                    <h3>TWO PLAYER GAMES</h3>
                         <!-- FIREBOY AND WATERGIRL-->
                   <article class="game-card"> 
                    <div class="game-image"> 
                        <img src="images/fireboy-watergirl.png" alt="Fireboy and Watergirl game" > 
                    </div> 
                    <div class="game-info"> 
                        
                              <a href="#"
                              class="https://daniyathecoder.github.io/fireboy-and-watergirl/" 
                              data-game="fireboy">
                               <h3>
Fireboy & Watergirl
                               </h3>  </a>
                               <P>
                                platform game
                               </P>

                            
            </div>
        </div>
        </article>

            

       </main>
<script src="script.js"></script>
<!--treasure chest popup-->
<div   class="treasure-overlay" id="treasureOverlay">
    <div class="treasure-popup">
        <!--close buttttton-->
        <button class="treasure-close" id="treasureChest">✘</button>

        <!--chest-->
        <div class="treasure-chest" id="treasureChest">

            <!--lid-->
            <div class="chest-lid">
                
                <div class="chest-lock">
                   🔒 
                </div>
            </div>
            <!--body-->
            <div class="chest-body" >
                <div class="chest-stripe"></div> </div>
        </div>
        <!--text-->
        <div class="treasure-text">
            <h2 id="treasureTItle">TREASURE FOUND!
            </h2>

            <p id="treasureMessage" >
                Touch the lock to open it.
            </p>
        </div>
        <!--play button-->
        <a id="treasurePlay"
        class="treasure-play"
        href="#"
        target="_blank">
    PLAY GAME
</a>
    </div>
</div>   
    </body>
</html>
