<!DOCTYPE html>
<html lang="en">
    <head>
        <title>GAME LIBRARY</title>
        <meta charset="utf-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <!--navigation bar--> 
       <header class="navbar">
        <div class="logo">
            GAME LIBRARY
        </div>
        <nav> 
            <a href="#home">Home</a>

            <a href="#games">
                Games
            </a>
            <a href="categories">
                Categories
            </a>
        </nav>
        <div class="nav-right">
            <button class="search-button">
                🔍
            </button>
            <button class="login-button">
                Login
            </button>
        </div>

       </header>

       <!--main content-->
       <main>
         <!--hero section-->
         <section class="hero" id="home">
            <div class="hero-text">
                <h1 class="hero-h1">
                    PLAY
                    <br>
                    OUR
                    <br>
                    GAMES.
                </h1>

                <a href="#games" class="hero-button">
                    <h2>
                        OUR GAMES
                    </h2>
                </a>

            </div>
         </section>

         <!--game library-->
         <section class="games-section" id="games">
            <div class="section-heading">
    
                <a href="#">
                    See All
                </a>
            </div>

            
         

         <!--categories-->
        <section class="categories-section" id="categories">
            <div class="section-heading">
                <div>
                    <h2 id="genre-h2">
                        Genres 
                    </h2>
                    
                </div>
            </div>

            <div class="categories">
                 <div class="game-grid">
                <div class="category-genre" id="adventure">

                               <h3> 
                        Adventure
                    </h3>
                    <!--era breaker-->
                <article class="game-card">
                    <div class="game-image">
                        <img 
                        src=".png"
                        alt="Era Breaker">
                    </div>

                    <div class="game-info">
                
                        <a href="https://rameesha-maker.github.io/ERA-BREAKER/" 
                        target="_blank"  
                        class="play-erabreaker" 
                        > <h3>
                         ERA BREAKER
                    </h3>
                        </a>
                         <p>
                    Doremon inspired 
                        </p>
                </div>
            </div>
                </article>
                <div class="category-genre" id="players2">
                    
                    <h3>TWO PLAYER GAMES</h3>
                         <!-- FIREBOY AND WATERGIRL-->
                   <article class="game-card"> 
                    <div class="game-image"> 
                        <img src="images/fireboy-watergirl.png" alt="Fireboy and Watergirl game" > 
                    </div> 
                    <div class="game-info"> 
                        
                              <a href="https://daniyathecoder.github.io/fireboy-and-watergirl/" 
                              target="_blank"
                               class="play-fireboy">
                               <h3>
Fireboy & Watergirl
                               </h3>  </a>
                               <P>
                                platform game
                               </P>

                            
            </div>
        </div>
        </article>

            

       </main>
<script src="script.js"></script>
    </body>
</html>
